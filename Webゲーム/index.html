<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>留学生育成シミュレーション</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-overlay"></div>

  <main class="app">
    <header class="game-header">
      <div>
        <p class="eyebrow">International Student Support Simulation</p>
        <h1>伝説の先生に、俺はなる！</h1>
      </div>
      <div class="header-note">
        出席率99%を守りながら、12週間で進路実現を目指そう
      </div>
    </header>

    <section class="top-status" id="topStatus"></section>

    <section class="main-layout">
      <section class="students-area">
        <div class="section-title-row">
          <h2>学生たち</h2>
          <p>学生を選んで、右の育成メニューから行動を選択してください。</p>
        </div>

        <div class="students-grid" id="studentsGrid"></div>
      </section>

      <aside class="side-panel">
        <div class="panel-card actions-panel">
          <h2>育成メニュー</h2>
          <p class="panel-desc">
            行動の効果は毎回少し変化します。友好度が高いほど成長しやすくなります。
          </p>

          <div class="action-buttons" id="actionButtons"></div>

          <button class="next-week-btn" id="nextWeekBtn">
            次の週へ進む
          </button>

          <p class="hint">
            ※ 出席率は基本的に回復しません。疲労・メンタル・生活・友好度を管理して、欠席を防ぎましょう。
          </p>
        </div>

        <div class="panel-card log-panel">
          <h2>記録</h2>
          <div class="log-area" id="logArea"></div>
        </div>
      </aside>
    </section>
  </main>

  <!-- 行動演出モーダル -->
  <div class="action-modal hidden" id="actionModal">
    <div class="modal-backdrop"></div>

    <div class="modal-content">
      <div class="modal-header">
        <div>
          <p class="modal-kicker">Action Scene</p>
          <h2 id="modalTitle">行動中</h2>
        </div>
        <button class="skip-btn" id="skipAnimationBtn">スキップ</button>
      </div>

      <div class="modal-image-wrap">
        <img id="modalActionImage" src="" alt="行動シーン" />
      </div>

      <p class="modal-text" id="modalText"></p>
    </div>
  </div>

  <!-- トースト -->
  <div class="toast hidden" id="toast"></div>

  <!-- 結果画面 -->
  <section class="result-screen hidden" id="resultScreen"></section>

  <script src="script.js"></script>
</body>
</html>
